<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AgentUI</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css" />
  <link rel="stylesheet" href="/styles.css?v=local-paper-viewer-20260809-8" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-title">
        <span>VietHuy/</span>
        <button id="themeToggle" class="theme-toggle" title="toggle light / dark theme">◐</button>
        <button id="newProjectBtn" class="new-project-btn" title="create new project">+ project</button>
      </div>
      <nav id="projectList" class="project-list"></nav>
      <div class="sidebar-divider"></div>
      <div class="tree-header">
        <span>Workspace</span>
        <span class="tree-hint" id="treeHint">⌥⌘C: copy path</span>
      </div>
      <div id="treeRoot" class="tree" tabindex="0"></div>
    </aside>
    <div class="sidebar-resizer" id="sidebarResizer" title="drag to resize sidebar"></div>

    <main class="workspace">
      <div class="topbar">
        <div class="tabs" id="tabs"></div>
        <div class="topbar-actions">
          <a id="dashBtn" class="topbar-btn" href="/dashboard.html" target="_blank" rel="noopener"
             title="Token usage, context and agent state across every project">📊 Dashboard</a>
          <button id="procBtn" class="topbar-btn" title="Submitted SLURM jobs across all clusters">▦ Process running</button>
          <button id="schedBtn" class="topbar-btn" title="Recurring / deferred scheduled agent runs">🕒 Schedules</button>
          <button id="skillsBtn" class="topbar-btn" title="Per-agent skills and MCP tools">⚡ Capabilities</button>
        </div>
        <div id="procDropdown" class="proc-dropdown" hidden></div>
        <div id="schedDropdown" class="sched-dropdown" hidden></div>
      </div>
      <div id="windowsRoot" class="windows-root">
        <div class="canvas-empty" id="canvasEmpty">Pick a project in the left sidebar</div>
      </div>
      <div id="terminalDock" class="terminal-dock collapsed"></div>
      <div id="usageWidget" class="usage-widget" hidden></div>
      <div id="taskbar" class="taskbar"></div>
    </main>
  </div>

  <button id="skillsTab" class="skills-tab" title="Per-agent capabilities">⚡<span>Capabilities</span></button>
  <aside id="skillsPanel" class="skills-panel">
    <div class="skills-panel-head">
      <span id="skillsPanelTitle">⚡ Agent capabilities</span>
      <button id="skillsClose" class="skills-close" title="hide panel">×</button>
    </div>
    <div id="skillsPanelHint" class="skills-panel-hint">Select an agent chat to inspect its isolated capability policy.</div>
    <div id="skillsList" class="skills-list"></div>
  </aside>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.9/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
  <script src="/app.js?v=agent-capabilities-20260906-1"></script>
</body>
</html>
