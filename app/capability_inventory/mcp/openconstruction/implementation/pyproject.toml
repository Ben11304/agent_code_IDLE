[project]
name = "openconstruction"
version = "0.1.3"
description = "OpenConstruction local MCP server and catalog API helpers."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
  { name = "OpenConstruction" }
]
dependencies = [
  "cryptography>=42,<46",
  "fastapi>=0.115,<1",
  "huggingface-hub>=0.25,<2",
  "httpx>=0.27,<1",
  "uvicorn>=0.30,<1",
]

[project.urls]
Homepage = "https://www.openconstruction.org/mcp.html"
Repository = "https://github.com/Ben11304/OC-mcp"
Issues = "https://github.com/Ben11304/OC-mcp/issues"

[project.scripts]
oc = "openconstruction_mcp.cli:main"
openconstruction-mcp = "openconstruction_mcp.server:main"
openconstruction-remote = "openconstruction_mcp.web:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["openconstruction_mcp*"]
exclude = ["skills*", "tests*", "scripts*"]

[tool.setuptools.data-files]
"share/openconstruction/skills" = ["skills/index.json"]
